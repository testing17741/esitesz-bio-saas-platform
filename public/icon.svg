<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f1a" />
      <stop offset="100%" stop-color="#0f1724" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Squircle with glowing border -->
  <rect x="16" y="16" width="480" height="480" rx="120" ry="120" fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="14" />

  <!-- Inner Soft Glow -->
  <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="none" stroke="rgba(14, 165, 233, 0.15)" stroke-width="6" />

  <!-- Geometric Modern 'E' Monogram -->
  <g transform="translate(140, 116)" filter="url(#glow)">
    <!-- Top Bar -->
    <path d="M 0 0 L 232 0 C 242 0 248 8 248 18 L 248 56 C 248 66 242 74 232 74 L 84 74 L 84 106 L 204 106 C 214 106 220 114 220 124 L 220 156 C 220 166 214 174 204 174 L 84 174 L 84 206 L 232 206 C 242 206 248 214 248 224 L 248 262 C 248 272 242 280 232 280 L 0 280 C -10 280 -16 272 -16 262 L -16 18 C -16 8 -10 0 0 0 Z" fill="url(#textGrad)" />
    
    <!-- Accent Dot / Badge -->
    <circle cx="216" cy="140" r="10" fill="#22c55e" />
  </g>
</svg>
